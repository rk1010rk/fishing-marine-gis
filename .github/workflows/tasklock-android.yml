# TaskLock（tasklock-android/）の検証用ビルド。
# :core の単体テストと :app のデバッグビルドを別ジョブにし、結果を分けて確認できるようにする。
name: TaskLock Android

on:
  push:
    branches: [ claude/smartphone-addiction-android-mvp-krank7 ]
    paths:
      - 'tasklock-android/**'
      - '.github/workflows/tasklock-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tasklock-android

jobs:
  core-test:
    name: ":core unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ルートの settings が :app（AGP）も含むため、:core のテストでも Android SDK が必要
      # 既定値の "tools" パッケージは配布終了しており失敗するため、platform-tools のみ指定する
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run :core tests
        run: ./gradlew :core:test --console=plain --stacktrace

      - name: Upload :core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: tasklock-android/core/build/reports/tests/test
          if-no-files-found: ignore

  app-build:
    name: ":app assembleDebug"
    runs-on: ubuntu-latest
    env:
      # 固定デバッグ鍵の証明書 SHA-256（公開情報）。CI の APK がこれと一致しなければ失敗させる
      EXPECTED_CERT_SHA256: 1e6152d6125d65401b2e65d47eda4c11e7af93708c2bfc0e58ab55d3dde9e090
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # 実行ごとに作られる使い捨てのデバッグ鍵ではなく、Secret の固定鍵で署名する（DESIGN.md §10「CI のデバッグ APK の署名」）
      # AGP が使うデバッグ鍵の場所を ANDROID_USER_HOME で明示し、そこに置く（build.gradle.kts は変更しない）
      # Secret の値・復号した鍵はログに出さない（set -x や echo をしない）
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.TASKLOCK_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64}" ]; then
            echo "::error::Secret TASKLOCK_DEBUG_KEYSTORE_B64 is not set; refusing to sign with a throwaway debug key"
            exit 1
          fi
          # 既定の場所は環境変数で変わるため、原因調査用に現在の値（公開情報）を表示してから明示的に指定する
          echo "Before: ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>} ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>} ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          keystore_dir="$HOME/.android"
          mkdir -p "$keystore_dir"
          echo "ANDROID_USER_HOME=$keystore_dir" >> "$GITHUB_ENV"
          echo "Keystore location: $keystore_dir/debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$keystore_dir/debug.keystore"
          chmod 600 "$keystore_dir/debug.keystore"
          # 鍵ファイルの証明書（公開情報）だけを確認する。Secret の誤登録をビルド前に検出するため
          actual=$(keytool -list -v -keystore "$keystore_dir/debug.keystore" -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Keystore certificate SHA-256: ${actual}"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate SHA-256 does not match the expected value ${EXPECTED_CERT_SHA256}"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      # 生成した APK が固定鍵で署名されていることを確認する。一致しなければジョブを失敗させる
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            exit 1
          fi
          echo "apksigner: ${apksigner}"
          echo "APK: ${apks[0]}"
          certs=$("$apksigner" verify --print-certs "${apks[0]}")
          # 署名者の表記は apksigner の版で異なる（"Signer #1 certificate" / "V2 Signer: certificate" など）ため、表記に依存せず
          # 証明書行（公開情報）だけを表示し、SHA-256 の種類がちょうど1つで期待値と一致することを確認する（Source Stamp は対象外）
          signer_lines=$(printf '%s\n' "$certs" | grep -E 'Signer.*certificate (DN|SHA-256 digest):' | grep -v '^Source Stamp' || true)
          printf '%s\n' "$signer_lines"
          digests=$(printf '%s\n' "$signer_lines" | grep 'SHA-256 digest:' \
            | sed -E 's/.*SHA-256 digest:[[:space:]]*//' | sort -u || true)
          count=$(printf '%s' "$digests" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            # 証明書行が見つからない場合だけ、原因調査のため apksigner の出力（公開情報のみ）をそのまま表示する
            printf '%s\n' "$certs"
          fi
          echo "APK distinct signing certificates: ${count}"
          echo "APK certificate SHA-256: ${digests}"
          if [ "$count" -ne 1 ] || [ "$digests" != "$EXPECTED_CERT_SHA256" ]; then
            # 原因調査用: ランナー上のデバッグ鍵の場所と証明書 SHA-256（公開情報）だけを表示する
            echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
            find "$HOME" /usr/local/lib/android /tmp -name debug.keystore -type f 2>/dev/null | while read -r ks; do
              fp=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey 2>/dev/null \
                | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f' || true)
              echo "Found debug keystore: $ks SHA-256: ${fp:-<unreadable>}"
            done || true
            echo "::error::APK signing certificate does not match the expected value ${EXPECTED_CERT_SHA256}"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tasklock-debug-apk
          path: tasklock-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Room のスキーマ JSON（DESIGN.md §9.6-2 マイグレーション①）。AutoMigration の前提となる v1 を取得するため
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: tasklock-room-schemas
          path: tasklock-android/app/schemas
          if-no-files-found: error

      # コミット済みの Room スキーマ JSON と、ビルドで Room が生成したものが一致することを確認する（DESIGN.md §9.6-2）
      # 差分や未コミットの JSON（例: 新しい版の JSON の入れ忘れ）があれば失敗させる。原因調査用に Upload Room schemas の後に置く
      - name: Verify committed Room schemas
        run: |
          set -euo pipefail
          status=$(git status --porcelain --untracked-files=all -- app/schemas)
          sha256sum app/schemas/*/*.json
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git diff -- app/schemas || true
            echo "::error::app/schemas differs from the schema JSON generated by Room"
            exit 1
          fi

      # 【一時的な調査用・後で削除する】Room が生成したスキーマ JSON の実際の出力先を特定する（run #25 の調査）
      # ガードではないため、結果に関わらず失敗させない。前の手順が失敗しても実行する
      - name: "TEMP: Locate Room schema JSON under app/build"
        if: always()
        run: |
          set -uo pipefail
          echo "--- app/build: *.json whose path contains 'schema'"
          find app/build -type f -name '*.json' -path '*schema*' -print | sort || true
          echo "--- SHA-256 of the files above"
          find app/build -type f -name '*.json' -path '*schema*' -print0 | sort -z | xargs -0 -r sha256sum || true
          echo "--- app/build: files named <number>.json (any path)"
          find app/build -type f -name '[0-9]*.json' -print0 | sort -z | xargs -0 -r sha256sum || true
          echo "--- committed app/schemas (for comparison)"
          sha256sum app/schemas/*/*.json || true
