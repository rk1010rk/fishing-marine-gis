<title>VTA・なぜなぜ分析ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 作業盤。上に事案バーと工程タブ、下に工程ごとの作業面（図＋編集パネル）。色は鋼板グレーに消防車の赤を一点、変動要因は琥珀。 */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#f5f7f9; --ink:#17202a; --muted:#566272; --line:#d1d8e0; --line-strong:#aab4c0;
  --accent:#b42318; --accent-ink:#ffffff; --accent-soft:#fbe8e5;
  --var:#9a5d0c; --var-soft:#fcf0d6;
  --ok:#2c7349; --ok-soft:#e2f1e7; --warn:#8d5300; --warn-soft:#fff2d3;
  --c-m:#6a4c9c; --c-S:#1d5fa3; --c-H:#4a5866; --c-E:#2b7650; --c-L:#a9500d; --c-LL:#9c3474;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151a; --surface:#1a2027; --sunk:#151a20; --ink:#e5e9ee; --muted:#9ba6b3; --line:#2c353f; --line-strong:#47525e;
  --accent:#ff6a5c; --accent-ink:#1a0d0b; --accent-soft:#3a1d1a;
  --var:#e3a541; --var-soft:#33280f;
  --ok:#62c08a; --ok-soft:#173023; --warn:#e9ac4a; --warn-soft:#33270f;
  --c-m:#ae93e0; --c-S:#6aa8ec; --c-H:#a3b0bd; --c-E:#6cc495; --c-L:#ee9a55; --c-LL:#e07ab8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#1a2027; --sunk:#151a20; --ink:#e5e9ee; --muted:#9ba6b3; --line:#2c353f; --line-strong:#47525e;
  --accent:#ff6a5c; --accent-ink:#1a0d0b; --accent-soft:#3a1d1a;
  --var:#e3a541; --var-soft:#33280f;
  --ok:#62c08a; --ok-soft:#173023; --warn:#e9ac4a; --warn-soft:#33270f;
  --c-m:#ae93e0; --c-S:#6aa8ec; --c-H:#a3b0bd; --c-E:#6cc495; --c-L:#ee9a55; --c-LL:#e07ab8;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.65}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.brand h1{font-size:24px;margin-top:2px}
.case{margin-top:4px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.save{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 12px;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}

.sample-band{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--var-soft);border:1px solid color-mix(in srgb,var(--var) 35%,transparent);border-radius:var(--r);padding:8px 12px;font-size:13px}
.sample-band strong{color:var(--var)}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:transparent;padding:10px 14px 9px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font-weight:700;display:flex;gap:7px;align-items:baseline}
.tab .no{font-family:var(--f-mono);font-size:11.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab.guide{margin-left:auto}

.panel{margin-top:20px}
.lead{max-width:68ch;color:var(--muted);margin-top:6px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px;align-items:start}
.work.why{grid-template-columns:300px minmax(0,1fr)}
@media (max-width:980px){.work,.work.why,.grid2{grid-template-columns:minmax(0,1fr)}}

/* forms */
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700}
label.check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink);font-weight:400;font-size:13.5px}
label.check input{margin-top:4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=month],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:7px 9px;color:var(--ink);font-weight:400;font-size:14px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.form{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
fieldset{border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:0;min-width:0}
legend{font-size:12.5px;color:var(--muted);font-weight:700;padding:0 4px}
.preds{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.preds label.check{font-size:12.5px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* VTA canvas */
.canvas-card{padding:0;overflow:hidden}
.canvas-bar{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.canvas{overflow:auto;max-height:78vh}
.linkbar{padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.canvas svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.lg{display:inline-flex;gap:6px;align-items:center}
.sw{width:22px;height:13px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface)}
.sw.var{border:2.5px solid var(--var);background:var(--var-soft);border-radius:7px}
.sw.event{background:var(--accent);border-color:var(--accent)}
.sw.o{width:14px;height:14px;border-radius:50%;border:3px solid var(--accent)}
.sw.brk{border:0;border-top:3px dashed var(--accent);border-radius:0;height:0;background:none}

svg .lane{fill:var(--surface)} svg .lane.odd{fill:var(--sunk)}
svg .lane-name{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13.5px}
svg .head-rule{stroke:var(--line-strong);stroke-width:1}
svg .row-rule{stroke:var(--line);stroke-dasharray:2 4}
svg .seq-label{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .time-label{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
svg .edge{fill:none;stroke:var(--muted);stroke-width:1.4}
svg .arrowhead{fill:var(--muted)}
svg .node{cursor:pointer}
svg .node .n-box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
svg .node:hover .n-box{stroke:var(--ink)}
svg .node.var .n-box{fill:var(--var-soft);stroke:var(--var);stroke-width:3}
svg .node.event .n-box{fill:var(--accent);stroke:var(--accent)}
svg .node.event .n-text,svg .node.event .n-kind{fill:var(--accent-ink)}
svg .node.sel .n-box{stroke:var(--ink);stroke-width:3;stroke-dasharray:6 3}
svg .node:focus{outline:none} svg .node:focus-visible .n-box{stroke:var(--accent);stroke-width:3}
svg .n-kind{fill:var(--muted);font-size:10.5px;font-weight:700}
svg .node.var .n-kind{fill:var(--var)}
svg .n-elim{fill:var(--accent);font-size:10.5px;font-weight:700}
svg .n-text{fill:var(--ink);font-size:12.5px}
svg .edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
svg .edge-g:hover .edge{stroke:var(--ink);stroke-width:2}
svg .brk-line{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 4}
svg .brk-lbl{fill:var(--accent);font-size:10.5px;font-weight:700}
svg .n-elim-mark{fill:var(--surface);stroke:var(--accent);stroke-width:3}
svg .time-axis{stroke:var(--muted);stroke-width:1.4;fill:none}
svg .cap2{fill:var(--muted);font-size:10.5px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.checks button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:6px 10px;font-size:13px}
.checks .ic{flex:0 0 auto;font-weight:700}
.checks .warn .ic{color:var(--warn)} .checks .info .ic{color:var(--muted)}
svg .empty{fill:var(--muted);font-size:13px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--c,var(--line-strong));color:var(--c,var(--muted));border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:20px;white-space:nowrap}
.chip.fill{background:var(--c);color:var(--surface);border-color:var(--c)}
[data-shell="m"]{--c:var(--c-m)} [data-shell="S"]{--c:var(--c-S)} [data-shell="H"]{--c:var(--c-H)} [data-shell="E"]{--c:var(--c-E)} [data-shell="L"]{--c:var(--c-L)} [data-shell="LL"]{--c:var(--c-LL)}
.chip.var{--c:var(--var)} .chip.elim{--c:var(--accent)} .chip.ok{--c:var(--ok)} .chip.warn{--c:var(--warn)}

/* why tree */
.targets{display:flex;flex-direction:column;gap:6px}
.target{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 11px}
.target[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.target .t-text{font-size:13.5px;color:var(--ink)}
.target .t-meta{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:11.5px;color:var(--muted)}
.focus-node{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.focus-node .q{font-family:var(--f-display);font-size:18px;font-weight:700}
.tree,.tree ol{list-style:none;margin:0;padding:0}
.tree ol{margin-left:22px;padding-left:14px;border-left:2px solid var(--line)}
.tree li{margin-top:10px}
.why-card{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.why-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.why-no{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.why-head select{width:auto;padding:3px 6px;font-size:12.5px}
.why-actions{display:flex;flex-wrap:wrap;gap:6px}
.lint{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:6px 9px;font-size:12.5px}
.rootcause{display:flex;flex-direction:column;gap:6px;background:var(--ok-soft);border-radius:5px;padding:7px 10px;font-size:12.5px}
.rootcause .rc{color:var(--ok);font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.dakara{margin-top:4px;font-size:12.5px;line-height:1.8}
.dakara b{color:var(--ok)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.figure{overflow-x:auto}
.figure svg{display:block;max-width:100%;height:auto}
svg .shell-block{stroke-width:2}
svg .shell-label{font-family:var(--f-display);font-weight:700;font-size:13px}
svg .shell-count{font-family:var(--f-mono);font-size:20px}
svg .shell-sub{font-size:10.5px;fill:var(--muted)}
svg .slice{stroke:var(--line-strong);stroke-width:1.2}
svg .hole{fill:var(--bg);stroke:var(--line-strong)}
svg .ray{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;fill:none}
svg .ray-head{fill:var(--accent)}
svg .cap{fill:var(--ink);font-size:11.5px;font-weight:700}
svg .cap2{fill:var(--muted);font-size:10.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .fillb{height:100%;background:var(--c-L)}
.bar .n{font-family:var(--f-mono);text-align:right}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}

/* measures */
.cause-card{display:flex;flex-direction:column;gap:10px}
.cause-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cause-text{font-weight:700;font-size:15px;flex:1 1 280px;min-width:0}
.ms{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.ms-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ms-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ms-top{display:flex;gap:8px;align-items:center}
.ms-no{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.prio{font-family:var(--f-mono);font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.prio.p-hi{background:var(--ok-soft);color:var(--ok)} .prio.p-md{background:var(--var-soft);color:var(--var)} .prio.p-lo{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
svg .mx-cell{fill:var(--sunk);stroke:var(--line)}
svg .mx-cell.best{fill:var(--ok-soft)}
svg .mx-axis{fill:var(--muted);font-size:11px}
svg .mx-dot{fill:var(--accent)}
svg .mx-lbl{fill:var(--accent-ink);font-family:var(--f-mono);font-size:10px}
.kono{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:12.5px}
.kono div{border:1px solid var(--line);border-radius:5px;padding:5px 8px;display:flex;justify-content:space-between;gap:6px;background:var(--surface)}
.kono div.on{border-color:var(--ok);background:var(--ok-soft)}
.kono .g{font-size:11px;color:var(--muted);grid-column:1/-1;margin-top:4px;font-weight:700;letter-spacing:.06em}

/* overview */
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step .st{font-weight:700}
.howto{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px;max-width:900px}
.howto b{font-family:var(--f-display)}
.howto ol{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.hints{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hints summary{font-size:13.5px;font-weight:700;color:var(--ink)}
.hint-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:10px}
.hint{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.hint b{color:var(--c)}
.hint ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;flex:1}
.errguide{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:13px}
.errguide ol{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:3px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sugg-list .btn{text-align:left;font-size:12.5px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.tpl{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--sunk);border-radius:var(--r);padding:10px 12px}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-size:14px}
.tpl span{font-size:12px;color:var(--muted)}
.terms td:first-child{font-weight:700;white-space:nowrap}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);font-size:13px;max-width:70ch}

/* guide */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px}
.guide-grid article{display:flex;flex-direction:column;gap:8px}
.guide-grid article p,.guide-grid li{font-size:13.5px;max-width:68ch}
.guide-grid ul,.guide-grid ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px}
.src{font-size:12px;color:var(--muted)}

/* report */
.report{width:100%;min-height:60vh;font-family:var(--f-body);font-size:13.5px;line-height:1.7;background:var(--surface)}

dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);padding:18px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,20,.5)}
dialog .form{gap:14px}
dialog textarea{font-family:var(--f-mono);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:color .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">事故・ヒヤリハットの要因分析</div>
      <h1>VTA・なぜなぜ分析ボード</h1>
      <div class="case" id="case-title"></div>
    </div>
    <div class="top-actions">
      <span class="save" id="save-state" role="status"></span>

function wrapText(t, n, max){
  const ch = [...t], out = [];
  while (ch.length && out.length < max) out.push(ch.splice(0, n).join(''));
  if (ch.length) out[max-1] = [...out[max-1]].slice(0, -1).join('') + '…';
  return out;
}
function vtaSVG(){
  const L = S.lanes, N = S.nodes, up = S.meta.dir !== 'down';
  const TW = 70, W = 178, BW = 152, BH = 78, RH = 104, HEAD = 48, PAD = 14;
  const seqs = [...new Set(N.map(n => +n.seq || 0))].sort((a,b) => a-b);
  const cnt = {}, slot = {}, rowMax = {}, rowY = {}, pos = {};
  seqs.forEach(s => rowMax[s] = 1);
  [...N].sort((a,b) => a.seq - b.seq).forEach(n => {
    const k = n.lane + '|' + (+n.seq||0); cnt[k] = (cnt[k]||0) + 1; slot[n.id] = cnt[k]-1;
    rowMax[+n.seq||0] = Math.max(rowMax[+n.seq||0], cnt[k]);
  });
  let y = HEAD + PAD;
  seqs.forEach(s => { rowY[s] = y; y += rowMax[s] * RH; });
  const A = HEAD + PAD, B = Math.max(y, A + RH);
  /* 下→上（JAXA式）のときは、行の並びを上下反転する */
  const fy = (yy, h) => up ? A + B - yy - h : yy;
  const height = B + PAD, width = TW + L.length * W + PAD;
  N.forEach(n => { const li = L.findIndex(l => l.id === n.lane); if (li < 0) return;
    pos[n.id] = {x: TW + li*W + (W-BW)/2, y: fy(rowY[+n.seq||0] + slot[n.id]*RH + (RH-BH)/2, BH)}; });

  let g = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
  g += `<rect class="lane" x="0" y="0" width="${TW}" height="${height}"/><text class="seq-label" x="10" y="28">順序 / 時刻</text>`;
  L.forEach((l,i) => { g += `<rect class="lane ${i%2?'':'odd'}" x="${TW+i*W}" y="0" width="${W}" height="${height}"/><text class="lane-name" x="${TW+i*W+W/2}" y="29" text-anchor="middle">${esc(l.name)}</text>`; });
  g += `<line class="head-rule" x1="0" x2="${width}" y1="${HEAD}" y2="${HEAD}"/>`;
  g += `<path class="time-axis" d="M${TW-8},${up ? B-6 : A+6} L${TW-8},${up ? A+6 : B-6}" marker-end="url(#arrow)"/><text class="cap2" x="${TW-14}" y="${up ? A+14 : B-8}" text-anchor="end">時間</text>`;
  seqs.forEach((s,i) => {
    const t = N.find(n => (+n.seq||0) === s && n.time)?.time || '';
    if (i){ const ry = up ? A + B - rowY[s] : rowY[s]; g += `<line class="row-rule" x1="0" x2="${width}" y1="${ry}" y2="${ry}"/>`; }
    const c = fy(rowY[s], rowMax[s]*RH) + rowMax[s]*RH/2;
    g += `<text class="seq-label" x="10" y="${c-4}">#${s}</text><text class="time-label" x="10" y="${c+12}">${esc(t)}</text>`;
  });
  const brks = [];
  S.edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    let d, mx, my;
    if (Math.abs(b.y - a.y) > 4){
      const down = b.y > a.y;
      const x1 = a.x+BW/2, y1 = down ? a.y+BH : a.y, x2 = b.x+BW/2, y2 = down ? b.y : b.y+BH, dy = (y2-y1)/2;
      d = `M${x1},${y1} C${x1},${y1+dy} ${x2},${y2-dy} ${x2},${y2}`; mx = (x1+x2)/2; my = (y1+y2)/2;
    } else {
      const dir = b.x >= a.x ? 1 : -1;
      const x1 = a.x + (dir>0?BW:0), y1 = a.y+BH/2, x2 = b.x + (dir>0?0:BW), y2 = b.y+BH/2;
      d = `M${x1},${y1} L${x2},${y2}`; mx = (x1+x2)/2; my = (y1+y2)/2;
    }
    g += `<g class="edge-g" data-act="toggle-brk" data-from="${e.from}" data-to="${e.to}"><title>クリックでブレイク（流れを断てた所）を付け外し</title><path class="edge-hit" d="${d}"/><path class="edge" d="${d}" marker-end="url(#arrow)"/></g>`;
    if (e.brk) brks.push([mx,my]);
  });
  brks.forEach(([x,y]) => { g += `<g transform="translate(${x},${y})" pointer-events="none"><line class="brk-line" x1="-22" x2="22" y1="0" y2="0"/></g>`; });
  N.forEach(n => {
    const p = pos[n.id]; if (!p) return;
    const cls = ['node', n.kind==='event'?'event':'', n.variation?'var':'', (ui.link ? ui.linkFrom===n.id : ui.sel===n.id)?'sel':''].join(' ');
    const lines = wrapText(n.text || '（内容未入力）', 11, 3);
    g += `<g class="${cls}" data-act="sel-node" data-id="${n.id}" transform="translate(${p.x},${p.y})" tabindex="0" role="button" aria-label="${esc(KINDS[n.kind]+'：'+n.text)}">
      <title>${esc(n.text)}${n.normal ? '\nふだんは：' + esc(n.normal) : ''}</title>
      <rect class="n-box" width="${BW}" height="${BH}" rx="${n.variation?18:5}"/>
      <text class="n-kind" x="11" y="17">${KINDS[n.kind]}${n.variation?'・変動':''}</text>
      ${lines.map((t,i) => `<text class="n-text" x="11" y="${37+i*15.5}">${esc(t)}</text>`).join('')}
      ${n.elim ? `<circle class="n-elim-mark" cx="${BW-4}" cy="4" r="10"/>` : ''}
    </g>`;
  });
  if (!N.length) g += `<text class="empty" x="${TW+16}" y="${HEAD+50}">まず「事故の瞬間」を右のパネルから追加してください（種別：事故事象）。</text>`;
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="VTA図">${g}</svg>`;
}
function vtaChecks(){
  const N = S.nodes, out = [];
  const short = n => '「' + (n.text.length > 18 ? n.text.slice(0,18) + '…' : n.text) + '」';
  const events = N.filter(n => n.kind === 'event');
  if (!N.length) return out;
  if (!events.length) out.push({lv:'warn', msg:'事故事象（種別「事故事象」）の四角がありません。最終的に起きた事故を1つ置きます。'});
  if (events.length > 1) out.push({lv:'info', msg:`事故事象が ${events.length} つあります。最終的な事故は1つにまとめるのが基本です。`});
  const reach = new Set(events.map(n => n.id)); let grew = true;
  while (grew){ grew = false; S.edges.forEach(e => { if (reach.has(e.to) && !reach.has(e.from)){ reach.add(e.from); grew = true; } }); }
  N.forEach(n => {
    if (n.kind === 'event') return;
    const outE = S.edges.some(e => e.from === n.id), inE = S.edges.some(e => e.to === n.id);
    if (!outE && !inE) out.push({lv:'warn', id:n.id, msg:`${short(n)} が矢印でどこにもつながっていません。`});
    else if (!outE) out.push({lv:'warn', id:n.id, msg:`${short(n)} から先の矢印がありません。事故につながる流れに入れるか、関係がなければ削除します。`});
    else if (events.length && !reach.has(n.id)) out.push({lv:'warn', id:n.id, msg:`${short(n)} が事故事象までつながっていません。`});
    if (n.elim && !n.variation) out.push({lv:'warn', id:n.id, msg:`${short(n)} は排除ノードですが「いつもと違った」の印がありません。排除ノードは変動要因の中から選びます。`});
    if (n.variation && !n.normal) out.push({lv:'info', id:n.id, msg:`${short(n)}：「ふだんはどうか」が空です。比べる基準を書くと、何が違ったのかがはっきりします。`});
    if (/べき|不注意|注意不足|確認不足|怠|油断|ミス|悪い/.test(n.text)) out.push({lv:'warn', id:n.id, msg:`${short(n)} に評価の言葉が入っています。VTAには、起きた事実だけを書きます。`});
    if ([...n.text].length > 40) out.push({lv:'info', id:n.id, msg:`${short(n)} は長めです。1つの四角に複数の出来事が入っていないか確かめます。`});
  });
  S.edges.forEach(e => { const a = nodeById(e.from), b = nodeById(e.to);
    if (a && b && (+a.seq) > (+b.seq)) out.push({lv:'warn', id:b.id, msg:`${short(a)} → ${short(b)} の矢印が時間をさかのぼっています。順序の番号を確認します。`}); });
  if (!N.some(n => n.elim)) out.push({lv:'warn', msg:'「なければ事故にならなかった点（排除ノード）」がまだありません。'});
  if (!S.edges.some(e => e.brk)) out.push({lv:'info', msg:'「流れを断てた所（ブレイク）」がまだありません。誰か・何かが気づけば止められた矢印をクリックして設定します。'});
  return out;
}

}

/* ---------- 3 why ---------- */
function blameMsg(){ return '「注意不足」「確認不足」などは結果の言い換えで、対策が「注意する」で止まりがちです。なぜ注意が向かなかったのか、何がそうさせたのかを、もう一段掘り下げてください。'; }
function whyItem(w, depth){
  const kids = childrenOf(w.id);
  const showErr = w.shell === 'L' || w.shell === 'LL';
  const chain = chainUp(w);
  const node = nodeById(w.nodeId);
  return `<li><div class="why-card" data-shell="${w.shell}">
    <div class="why-head">
      <span class="why-no">なぜ${depth}</span>
      <select id="ws-${w.id}" data-why="${w.id}" data-field="shell" aria-label="m-SHELL分類">${Object.entries(SHELL).map(([k,v]) => `<option value="${k}" ${k===w.shell?'selected':''}>${v.label}（${v.term}）</option>`).join('')}</select>
      ${showErr?`<select id="we-${w.id}" data-why="${w.id}" data-field="err" aria-label="エラーの型">${Object.entries(ERR).map(([k,v]) => `<option value="${k}" ${k===w.err?'selected':''}>${v}</option>`).join('')}</select>`:''}
    </div>
    <textarea id="wt-${w.id}" data-why="${w.id}" data-field="text" rows="2" placeholder="なぜそうなったのか（事実に基づいて）" aria-label="要因">${esc(w.text)}</textarea>
    <div class="lint" ${BLAME.test(w.text)?'':'hidden'}>${blameMsg()}</div>
    ${kids.length ? '' : `<div class="rootcause"><span class="rc">根本要因として扱います${S.measures.some(m => m.whyId===w.id)?'（対策あり）':'（対策未設定）'}</span>
      ${depth < 3 ? '<span>まだ浅いかもしれません。規則・教育・装備・体制など、仕組みのレベルに届くまで掘り下げましょう。</span>' : ''}
      <details><summary>逆読み確認（「だから」でつながるか）</summary><div class="dakara">${chain.map(c => esc(c.text||'（未入力）')).join(' <b>だから</b> ')} <b>だから</b> ${esc(node?.text||'')}</div></details></div>`}
    <div class="why-actions">
      <button class="btn sm" data-act="why-child" data-id="${w.id}">＋ さらに、なぜ？</button>
      <button class="btn ghost sm" data-act="why-sib" data-id="${w.id}">＋ 並列の要因</button>
      <button class="btn ghost sm danger" data-act="why-del" data-id="${w.id}">削除</button>
    </div>
  </div>${kids.length ? `<ol>${kids.map(k => whyItem(k, depth+1)).join('')}</ol>` : ''}</li>`;
}
function renderWhy(){
  const ts = targets();
  if (!ui.target || !ts.some(t => t.id === ui.target)) ui.target = ts[0]?.id || null;

    <p class="lead">前の工程で印を付けた点ごとに「なぜ？」を繰り返します。要因には6つの観点（m-SHELL）のどれに当たるかを付け、本人や周りの人の要因には、どんな種類のエラーかも選びます。</p></div></div>
  <!--howto-->
  <div class="work why">
    <aside class="targets" aria-label="分析対象">
      ${ts.length ? ts.map(t => { const c = S.whys.filter(w => w.nodeId === t.id).length;
        return `<button class="target" aria-pressed="${t.id===ui.target}" data-act="sel-target" data-id="${t.id}">
          <span class="t-meta">${t.elim?'<span class="chip elim">○ 排除ノード</span>':''}${t.variation?'<span class="chip var">いつもと違う</span>':''}<span class="mono">#${t.seq}</span>${esc(laneName(t.lane))}</span>
          <span class="t-text">${esc(t.text)}</span>

        : `<div class="card small muted">VTAの画面で「いつもと違った」か「排除ノード」の印を付けると、ここに並びます。</div>`}
    </aside>
    <section class="card">
      ${n ? `<div class="focus-node">
          <span class="t-meta small muted">${esc(laneName(n.lane))} ／ ${KINDS[n.kind]} ／ #${n.seq} ${esc(n.time)}</span>

          <div class="hint-grid">${Object.entries(SHELL).map(([k,v]) => `<div class="hint" data-shell="${k}"><b>${v.name}</b><ul>${v.q.map(q => `<li>${q}</li>`).join('')}</ul><button class="btn sm" data-act="why-root" data-shell="${k}">この観点で要因を追加</button></div>`).join('')}</div>
          <div class="errguide"><b>エラーの種類の見分け方</b>（本人・周りの人の要因に付けます）
            <ol><li>決まりや手順を知っていて、わざと外れた → <b>違反</b></li>
            <li>やろうとしたこと自体が間違っていた → <b>ミステイク</b>（経験やルールの当てはめ違いなら規則ベース、知識がなかったなら知識ベース）</li>
            <li>やろうとしたことは正しかったが、動作を誤った → <b>スリップ</b></li>
            <li>やろうとしたことは正しかったが、抜けた・忘れた → <b>ラプス</b></li></ol></div>
        </details>`
        : `<p class="muted">左の一覧から分析対象を選んでください。</p>`}

/* ---------- 4 factors ---------- */
function shellDiagram(all, rc){
  const box = (k, x, y, w, h) => {
    const c = all[k] || 0, r = rc[k] || 0, op = c ? Math.min(.12 + c*.08, .5) : 0;
    return `<g data-shell="${k}"><rect class="shell-block" x="${x}" y="${y}" width="${w}" height="${h}" rx="8" style="fill:var(--c);fill-opacity:${op};stroke:var(--c)"/>
      <text class="shell-label" x="${x+w/2}" y="${y+22}" text-anchor="middle" style="fill:var(--c)">${k==='LL'?'L-L':k}</text>
      <text class="shell-count" x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" style="fill:var(--ink)">${c}</text>
      <text class="shell-sub" x="${x+w/2}" y="${y+h-10}" text-anchor="middle">根本 ${r}</text></g>`;
  };
  const cm = all.m || 0;
  return `<svg viewBox="0 0 380 330" width="380" role="img" aria-label="m-SHELLモデルの要因件数">
    <g data-shell="m"><rect x="6" y="6" width="368" height="318" rx="14" style="fill:var(--c);fill-opacity:${cm?Math.min(.06+cm*.04,.25):0};stroke:var(--c);stroke-width:2;stroke-dasharray:7 4"/>
    <text class="shell-label" x="22" y="30" style="fill:var(--c)">m 管理</text>
    <text class="shell-count" x="22" y="56" style="fill:var(--ink)">${cm}</text><text class="shell-sub" x="22" y="72">根本 ${rc.m||0}</text></g>
    ${box('S',150,22,80,88)}${box('H',58,120,84,88)}${box('L',150,120,80,88)}${box('LL',238,120,84,88)}${box('E',150,218,80,88)}
  </svg>`;
}
function swiss(rc){
  const layers = [['m','組織・管理'],['S','規則・教育'],['H','車両・装備'],['E','環境'],['LL','現場の連携'],['L','当事者の行為']];
  const X0 = 40, GAP = 92, top = 30, h = 150;
  let g = '';
  layers.forEach(([k,name],i) => {
    const x = X0 + i*GAP, n = rc[k] || 0;
    g += `<g data-shell="${k}"><path class="slice" d="M${x},${top+12} L${x+34},${top} L${x+34},${top+h} L${x},${top+h+12} Z" style="fill:var(--c);fill-opacity:.18"/>`;
    for (let j = 0; j < Math.min(n, 4); j++){ const cy = top + 32 + j*30 + (j%2?6:0); g += `<ellipse class="hole" cx="${x+17}" cy="${cy}" rx="9" ry="11"/>`; }
    g += `<text class="cap" x="${x+17}" y="${top+h+34}" text-anchor="middle">${name}</text><text class="cap2" x="${x+17}" y="${top+h+50}" text-anchor="middle">${i<4?'潜在的':''}${i===4?'前提条件':''}${i===5?'即発的':''}・穴 ${n}</text></g>`;
  });
  const endX = X0 + layers.length*GAP;
  g += `<path class="ray" d="M8,${top+h/2} L${endX},${top+h/2}"/><path class="ray-head" d="M${endX},${top+h/2-6} L${endX+12},${top+h/2} L${endX},${top+h/2+6} Z"/>`;
  g += `<text class="cap2" x="8" y="${top-10}">危険</text><text class="cap" x="${endX+14}" y="${top+h/2-12}" text-anchor="end">横転</text>`;
  return `<svg viewBox="0 0 ${endX+20} ${top+h+62}" width="${endX+20}" role="img" aria-label="スイスチーズモデル">${g}</svg>`;
}
function renderFactors(){
  const all = {}, rc = {}, errs = {};
  S.whys.forEach(w => { all[w.shell] = (all[w.shell]||0)+1; if (w.err) errs[w.err] = (errs[w.err]||0)+1; });
  const lv = leaves(); lv.forEach(w => rc[w.shell] = (rc[w.shell]||0)+1);
  const maxErr = Math.max(1, ...Object.values(errs));
  const stats = [
    ['ノード', S.nodes.length], ['変動要因', S.nodes.filter(n => n.variation).length], ['排除ノード', S.nodes.filter(n => n.elim).length],
    ['なぜ項目', S.whys.length], ['根本要因', lv.length], ['対策', S.measures.length]
  ];
  const blameLeaves = lv.filter(w => BLAME.test(w.text)).length;
  const indivOnly = lv.length && lv.every(w => w.shell === 'L' || w.shell === 'LL');
  return `
  <div class="sec-head"><div><h2>要因整理</h2>
    <p class="lead">なぜなぜで挙げた要因を、m-SHELLとエラーの型で集計します。スイスチーズモデルでは、根本要因を「防護の穴」として層ごとに表します。</p></div></div>
  <!--howto-->
  <div class="stats">${stats.map(([k,v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>
  ${blameLeaves || indivOnly ? `<div class="lint" style="margin-top:12px">${blameLeaves?`根本要因のうち ${blameLeaves} 件が「注意不足」型の表現で止まっています。`:''}${indivOnly?'根本要因が当事者（L・L-L）だけに偏っています。規則・装備・管理の層にも穴がないか確認してください。':''}</div>` : ''}
  <div class="grid2" style="margin-top:16px">
    <section class="card"><h3>6つの観点（m-SHELLモデル）</h3><p class="small muted" style="margin:4px 0 10px">中央の本人（L）と、周りの要素との接点で問題が起きたと考えます。数字は「なぜ」の件数です。</p><div class="figure">${shellDiagram(all, rc)}</div><div class="legend" style="margin-top:8px">${Object.entries(SHELL).map(([k,v]) => `<span class="lg">${shellChip(k)}<span class="mono">${v.term}</span></span>`).join('')}</div></section>
    <section class="card"><h3>エラーの種類（Reason）</h3><p class="small muted" style="margin:4px 0 12px">本人・周りの人の要因に付けた種類です。種類によって効く対策が違います。</p>
      <div class="bars">${Object.entries(ERR_SHORT).map(([k,v]) => `<div class="bar"><span>${v}</span><span class="track"><span class="fillb" style="display:block;width:${(errs[k]||0)/maxErr*100}%"></span></span><span class="n">${errs[k]||0}</span></div>`).join('')}</div>
      <ul class="small muted" style="margin:14px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px">
        <li>スリップ・ラプス：表示・配置・チェックリストなど、やり方の設計で防ぐ。</li>
        <li>ミステイク：知識・訓練・判断基準の明確化で防ぐ。</li>
        <li>違反：守れない規則や、守らないほうが得をする状況を変える。</li>
      </ul></section>
  </div>
  <section class="card" style="margin-top:16px"><h3>スイスチーズモデル（根本要因の分布）</h3><p class="small muted" style="margin:4px 0 10px">組織・規則・装備・環境の穴（潜在的な条件）が重なったところに、当事者の行為（即発的エラー）が加わって事故に至ります。</p><div class="figure">${swiss(rc)}</div></section>
  <section class="card" style="margin-top:16px"><h3>根本要因の一覧</h3>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>分類</th><th>根本要因</th><th>由来のノード</th><th>対策</th></tr></thead><tbody>
    ${lv.length ? lv.map(w => { const n = nodeById(w.nodeId), c = S.measures.filter(m => m.whyId === w.id).length;
      return `<tr><td>${shellChip(w.shell)}</td><td>${esc(w.text)}</td><td class="small muted">${esc(n?.text||'')}</td><td>${c?`<span class="chip ok">${c} 件</span>`:'<span class="chip warn">未設定</span>'}</td></tr>`; }).join('')
      : '<tr><td colspan="4" class="muted">まだ根本要因がありません。</td></tr>'}
    </tbody></table></div></section>`;
}

/* ---------- 5 measures ---------- */
function matrix(){
  const C = 64, X0 = 46, Y0 = 10;
  let g = '';
  for (let e = 3; e >= 1; e--) for (let f = 1; f <= 3; f++){
    g += `<rect class="mx-cell ${e===3&&f===3?'best':''}" x="${X0+(f-1)*C}" y="${Y0+(3-e)*C}" width="${C}" height="${C}"/>`;
  }
  const bucket = {};
  S.measures.forEach(m => { const k = (+m.eff||1)+'-'+(+m.feas||1); (bucket[k] = bucket[k] || []).push(m); });
  Object.entries(bucket).forEach(([k, ms]) => {
    const [e, f] = k.split('-').map(Number);
    ms.forEach((m,i) => { const cx = X0+(f-1)*C + 16 + (i%3)*16, cy = Y0+(3-e)*C + 16 + Math.floor(i/3)*16;
      g += `<circle class="mx-dot" cx="${cx}" cy="${cy}" r="7.5"/><text class="mx-lbl" x="${cx}" y="${cy+3.5}" text-anchor="middle">${msNo(m)}</text>`; });
  });
  ['高','中','低'].forEach((t,i) => g += `<text class="mx-axis" x="${X0-8}" y="${Y0+i*C+C/2+4}" text-anchor="end">${t}</text>`);
  ['低','中','高'].forEach((t,i) => g += `<text class="mx-axis" x="${X0+i*C+C/2}" y="${Y0+3*C+16}" text-anchor="middle">${t}</text>`);
  g += `<text class="mx-axis" x="${X0+1.5*C}" y="${Y0+3*C+34}" text-anchor="middle">実現性 →</text><text class="mx-axis" x="10" y="${Y0+1.5*C}" transform="rotate(-90 10 ${Y0+1.5*C})" text-anchor="middle">効果 →</text>`;
  return `<svg viewBox="0 0 ${X0+3*C+10} ${Y0+3*C+42}" width="${X0+3*C+10}" role="img" aria-label="対策の優先度マトリクス">${g}</svg>`;
}
function suggestionsFor(w){
  const seen = new Set(S.measures.filter(m => m.whyId === w.id).map(m => m.text));
  const list = [...(SUGGEST[w.err] || []), ...(SUGGEST[w.shell] || []), ...SUGGEST.all];
  return list.filter((x,i) => list.findIndex(y => y[0] === x[0]) === i && !seen.has(x[0]));
}

/* ---------- 6 report ---------- */
function reportText(){
  const m = S.meta, out = [];
  const line = (k,v) => v && out.push(`${k}：${v}`);
  out.push(`■ ${m.title || '（事案名未入力）'}`, '');
  out.push('1 事案の概要');
  line('発生日時', m.date ? m.date.replace('T',' ') : ''); line('発生場所', m.place); line('関係した物', m.vehicle); line('関係者', m.crew);
  line('天候・場所の状態', [m.weather, m.road].filter(Boolean).join('／')); line('概要', m.summary); line('被害', m.damage);
  out.push('', '2 事故に至る経過（VTA）');
  [...S.nodes].sort((a,b) => a.seq - b.seq).forEach(n => {
    const tag = [n.variation?'変動要因':'', n.elim?'排除ノード':''].filter(Boolean).join('・');
    out.push(`  #${n.seq}${n.time?' '+n.time:''}［${laneName(n.lane)}］${n.text}${tag?'　◀'+tag:''}`);
    if (n.variation && n.normal) out.push(`      （ふだんは：${n.normal}）`);
  });
  const bk = S.edges.filter(e => e.brk && nodeById(e.from) && nodeById(e.to));
  if (bk.length){ out.push('  ブレイク（流れを断てた所）'); bk.forEach(e => out.push(`    ${nodeById(e.from).text} → ${nodeById(e.to).text}`)); }
  out.push('', '3 背後要因の分析（なぜなぜ分析）');
  targets().forEach(n => {
    const roots = S.whys.filter(w => w.nodeId === n.id && !w.parentId); if (!roots.length) return;
    out.push(`  ◆ ${n.text}`);
    const walk = (w, d) => { out.push(`${'    '.repeat(d)}なぜ${d}：${w.text}〔${SHELL[w.shell].name}${w.err?'／'+ERR_SHORT[w.err]:''}〕`); childrenOf(w.id).forEach(c => walk(c, d+1)); };
    roots.forEach(r => walk(r, 1));
  });
  const lv = leaves();
  out.push('', '4 要因の分類（m-SHELLモデル）');
  Object.entries(SHELL).forEach(([k,v]) => { const a = S.whys.filter(w => w.shell===k).length, r = lv.filter(w => w.shell===k).length; if (a) out.push(`  ${v.name}：${a}件（うち根本要因 ${r}件）`); });
  out.push('', '5 再発防止対策');
  [...S.measures].sort((a,b) => prio(b) - prio(a)).forEach(x => {
    const w = S.whys.find(y => y.id === x.whyId);
    out.push(`  対策${msNo(x)}　${x.text}`);
    out.push(`    対象要因：${w?.text||''}`);
    out.push(`    発想：${KONO[+x.kono]}　階層：${LEVELS.find(l => l.id===x.level)?.label||''}　優先度：${prio(x)}（効果${x.eff}×実現性${x.feas}）${x.owner?'　担当：'+x.owner:''}${x.due?'　期限：'+x.due:''}`);
  });
  const none = lv.filter(w => !S.measures.some(x => x.whyId === w.id));
  if (none.length){ out.push('', '  ※対策未設定の根本要因'); none.forEach(w => out.push(`    ・${w.text}`)); }
  return out.join('\n');
}

    <p class="lead">ここまでの入力から、報告書の下書きを組み立てます。コピーして庁内の様式に貼り付けてください。</p></div>

/* ---------- actions ---------- */
function setTab(id){ ui.tab = id; try { localStorage.setItem(KEY+':tab', id); } catch(_){} render(); window.scrollTo({top:0}); }
function askConfirm(title, msg, fn){
  $('#confirm-title').textContent = title; $('#confirm-msg').textContent = msg; ui.confirm = fn;
  const d = $('#dlg-confirm'); d.showModal ? d.showModal() : d.setAttribute('open','');
}
function closeDialogs(){ document.querySelectorAll('dialog').forEach(d => d.close ? d.close() : d.removeAttribute('open')); }
function removeWhy(id){
  const ids = new Set([id]); let grew = true;
  while (grew){ grew = false; S.whys.forEach(w => { if (w.parentId && ids.has(w.parentId) && !ids.has(w.id)){ ids.add(w.id); grew = true; } }); }
  S.whys = S.whys.filter(w => !ids.has(w.id)); S.measures = S.measures.filter(m => !ids.has(m.whyId));
}
function copyText(text, el){
  const done = () => toast('コピーしました');
  try { navigator.clipboard.writeText(text).then(done, () => { el?.select(); toast('選択しました。Ctrl+C（⌘C）でコピーしてください'); }); }
  catch(_){ el?.select(); toast('選択しました。Ctrl+C（⌘C）でコピーしてください'); }
}
function loadData(d){
  if (!valid(d)){ toast('分析データの形式ではありません。このツールで書き出したJSONを使ってください'); return false; }

}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'tab': setTab(id); break;
    case 'sel-node':
      if (ui.link){
        if (!ui.linkFrom || ui.linkFrom === id){ ui.linkFrom = ui.linkFrom === id ? null : id; render(); break; }
        const i = S.edges.findIndex(x => x.from === ui.linkFrom && x.to === id);
        if (i >= 0){ S.edges.splice(i, 1); toast('矢印を消しました'); } else { S.edges.push({from:ui.linkFrom, to:id}); toast('矢印でつなぎました'); }
        ui.linkFrom = null; save(); render(); break;
      }
      ui.sel = id; render(); break;
    case 'toggle-brk': { const e = S.edges.find(x => x.from === a.dataset.from && x.to === a.dataset.to); if (!e) return; e.brk = !e.brk; save(); render(); toast(e.brk ? 'ブレイク（流れを断てた所）を付けました' : 'ブレイクを外しました'); break; }
    case 'flip-dir': S.meta.dir = S.meta.dir === 'down' ? 'up' : 'down'; save(); render(); break;
    case 'link-mode': ui.link = !ui.link; ui.linkFrom = null; render(); break;
    case 'new-node': ui.sel = null; render(); $('#f-text')?.focus(); break;
    case 'save-node': {
      const text = $('#f-text').value.trim();
      if (!text){ toast('内容を入力してください'); $('#f-text').focus(); return; }
      let n = nodeById(ui.sel);
      if (!n){ n = {id:uid('n')}; S.nodes.push(n); }
      Object.assign(n, {lane:$('#f-lane').value, seq:+$('#f-seq').value || 0, time:$('#f-time').value.trim(), kind:$('#f-kind').value, text, normal:$('#f-normal').value.trim(), variation:$('#f-var').checked || $('#f-elim').checked, elim:$('#f-elim').checked, note:$('#f-note').value});
      const preds = [...document.querySelectorAll('.f-pred:checked')].map(x => x.value);
      const old = S.edges.filter(x => x.to === n.id);
      S.edges = S.edges.filter(x => x.to !== n.id).concat(preds.map(p => ({from:p, to:n.id, brk:!!old.find(o => o.from === p)?.brk})));
      ui.lastLane = n.lane;
      const wasNew = ui.sel !== n.id; ui.sel = wasNew ? null : n.id;
      save(); render(); toast(wasNew ? 'ノードを追加しました' : 'ノードを更新しました');
      break; }
    case 'del-node': {
      const n = nodeById(ui.sel); if (!n) return;
      const wc = S.whys.filter(w => w.nodeId === n.id).length;
      askConfirm('ノードを削除', `「${n.text}」を削除します。${wc?`このノードのなぜなぜ ${wc} 件と、その対策も削除されます。`:''}`, () => {
        S.whys.filter(w => w.nodeId === n.id && !w.parentId).forEach(w => removeWhy(w.id));
        S.nodes = S.nodes.filter(x => x.id !== n.id); S.edges = S.edges.filter(x => x.from !== n.id && x.to !== n.id);
        ui.sel = null; save(); render(); toast('ノードを削除しました');
      }); break; }
    case 'goto-why': ui.target = id; setTab('why'); break;
    case 'lane-add': { const l = {id:uid('l'), name:'新しい関係者'}; S.lanes.push(l); ui.laneOpen = true; save(); render(); const inp = $('#lane-'+l.id); if (inp){ inp.focus(); inp.select(); } toast('欄を追加しました。右のパネルで名前を変えてください'); break; }
    case 'lane-move': { const i = S.lanes.findIndex(l => l.id === id), j = i + (+a.dataset.dir); if (j < 0 || j >= S.lanes.length) return; [S.lanes[i], S.lanes[j]] = [S.lanes[j], S.lanes[i]]; save(); render(); break; }
    case 'lane-del': if (S.nodes.some(n => n.lane === id)){ toast('このレーンにはノードがあります。先にノードを移すか削除してください'); return; } S.lanes = S.lanes.filter(l => l.id !== id); save(); render(); break;
    case 'sel-target': ui.target = id; render(); break;
    case 'why-root': { const w = {id:uid('w'), nodeId:ui.target, parentId:null, text:'', shell:a.dataset.shell || 'L', err:''}; S.whys.push(w); save(); render(); $('#wt-'+w.id)?.focus(); break; }
    case 'why-child': case 'why-sib': {
      const p = S.whys.find(w => w.id === id); if (!p) return;
      const w = {id:uid('w'), nodeId:p.nodeId, parentId: a.dataset.act==='why-child' ? p.id : p.parentId, text:'', shell: a.dataset.act==='why-child' ? 'S' : p.shell, err:''};
      S.whys.push(w); save(); render(); $('#wt-'+w.id)?.focus(); break; }
    case 'why-del': {
      const w = S.whys.find(x => x.id === id); if (!w) return;
      const kids = childrenOf(id).length;
      if (!kids && !w.text){ removeWhy(id); save(); render(); return; }
      askConfirm('要因を削除', `「${w.text || '（未入力）'}」${kids?'と、その下の要因':''}を削除します。関連する対策も削除されます。`, () => { removeWhy(id); save(); render(); });
      break; }
    case 'ms-add': { const m = {id:uid('m'), whyId:id, text:'', kono:0, level:'adm', eff:2, feas:2, owner:'', due:''}; S.measures.push(m); save(); render(); $('#ms-text-'+m.id)?.focus(); break; }
    case 'ms-sugg': { const w = S.whys.find(x => x.id === id), x = w && suggestionsFor(w).find(y => y[0] === a.dataset.text); if (!x) return;
      const m = {id:uid('m'), whyId:id, text:x[0], kono:x[1], level:x[2], eff:2, feas:2, owner:'', due:''}; S.measures.push(m); save(); render(); $('#ms-text-'+m.id)?.focus(); break; }
    case 'ms-del': S.measures = S.measures.filter(m => m.id !== id); save(); render(); break;
    case 'copy-report': copyText($('#report-text').value, $('#report-text')); break;
    case 'open-data': { $('#json-out').value = JSON.stringify(S, null, 2); $('#json-in').value = ''; $('#json-file').value = ''; const d = $('#dlg-data'); d.showModal ? d.showModal() : d.setAttribute('open',''); break; }
    case 'copy-json': copyText($('#json-out').value, $('#json-out')); break;
    case 'download-json': {
      try {
        const url = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}));
        const link = document.createElement('a'); link.href = url; link.download = (S.meta.title || 'vta-analysis').replace(/[\\/:*?"<>|]/g,'_') + '.json';
        document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('保存を開始しました。保存されない環境では「コピー」を使ってください');
      } catch(_){ toast('この環境ではファイル保存ができません。「コピー」を使ってください'); }
      break; }
    case 'import-json': {
      const f = $('#json-file').files[0];
      const go = txt => { try { if (loadData(JSON.parse(txt))){ closeDialogs(); toast('読み込みました'); } } catch(_){ toast('JSONとして読み取れません。貼り付けた内容を確認してください'); } };
      if (f){ const r = new FileReader(); r.onload = () => go(r.result); r.readAsText(f); }
      else if ($('#json-in').value.trim()) go($('#json-in').value);
      else toast('JSONを貼り付けるか、ファイルを選んでください');
      break; }
    case 'open-new': { $('#tpl-grid').innerHTML = Object.entries(TEMPLATES).map(([k,t]) => `<button class="tpl" data-act="start-new" data-id="${k}"><b>${t.label}</b><span>${t.sub}</span></button>`).join(''); const d = $('#dlg-new'); d.showModal ? d.showModal() : d.setAttribute('open',''); break; }
    case 'start-new': S = blank(id); ui.sel = null; ui.target = null; closeDialogs(); save(); setTab('overview'); toast(`「${TEMPLATES[id].label}」で新しい分析を始めました`); break;
    case 'load-sample': S = withExtras(id === 'office' ? sampleOffice() : sample()); ui.sel = null; ui.target = null; closeDialogs(); save(); setTab('vta'); toast('記入例を読み込みました'); break;
    case 'confirm-yes': { const fn = ui.confirm; ui.confirm = null; closeDialogs(); fn && fn(); break; }
    case 'close-dlg': closeDialogs(); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('g.node')){ e.preventDefault(); ui.sel = e.target.dataset.id; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.meta){ S.meta[t.dataset.meta] = t.value; save(); if (t.dataset.meta === 'title') $('#case-title').textContent = t.value || '事案名が未入力です'; return; }
  if (t.dataset.why){ const w = S.whys.find(x => x.id === t.dataset.why); if (!w) return; w[t.dataset.field] = t.value; save();
    if (t.dataset.field === 'text'){ const l = t.parentElement.querySelector('.lint'); if (l) l.hidden = !BLAME.test(t.value); } return; }
  if (t.dataset.ms){ const m = S.measures.find(x => x.id === t.dataset.ms); if (!m) return; const f = t.dataset.field; m[f] = (f==='eff'||f==='feas'||f==='kono') ? +t.value : t.value; save(); return; }
  if (t.dataset.lane){ const l = S.lanes.find(x => x.id === t.dataset.lane); if (l){ l.name = t.value; save(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && (t.dataset.why || t.dataset.ms)) render();
  if (t.dataset.lane) render();
});

render();
$('#save-state').textContent = S.isSample ? 'サンプルを表示中（編集すると自動保存）' : 'このブラウザに自動保存済み';
</script>
